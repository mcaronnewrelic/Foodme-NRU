integrations:
  - name: nri-nginx
    env:
      # Status URL for nginx stub_status module
      STATUS_URL: http://127.0.0.1:8080/nginx_status
      
      # Connection settings
      CONNECTION_TIMEOUT: 5
      HTTP_TIMEOUT: 30
      
      # SSL settings
      VALIDATE_CERTS: false
      
      # Metrics collection settings
      METRICS: true
      INVENTORY: true
      
      # EC2 deployment settings
      REMOTE_MONITORING: false
      
      # Custom attributes for better organization
      CUSTOM_ATTRIBUTES: '{"service":"nginx","environment":"staging","application":"foodme","role":"web-server","deployment":"ec2"}'
      
      # Optional: Parse nginx access logs for additional metrics
      ACCESS_LOG_PATH: /var/log/nginx/access.log
      ERROR_LOG_PATH: /var/log/nginx/error.log
      
      # The access log is JSON (see install-foodme.sh's log_format), which
      # this integration's log parser cannot read - so log-derived metrics
      # are off. Status splits are computed from the forwarded JSON log
      # attributes in NR Logs instead. The stub_status metrics above are
      # unaffected.
      COLLECT_LOG_METRICS: false
      
    interval: 30s
    labels:
      env: staging
      role: web-server
      service: nginx
      application: foodme
      deployment: ec2
    inventory_source: config/nginx
