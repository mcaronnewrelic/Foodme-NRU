logs:
  - name: foodme-backend-output
    file: /home/ec2-user/.pm2/logs/foodme-backend-out.log
    attributes:
      logtype: foodme-application
      service: foodme-backend
      environment: production
      component: nodejs-backend
      log_level: info
    
  - name: foodme-backend-errors
    file: /home/ec2-user/.pm2/logs/foodme-backend-error.log
    attributes:
      logtype: foodme-application
      service: foodme-backend
      environment: production
      component: nodejs-backend
      log_level: error
      
  - name: foodme-backend-simple-output
    file: /home/ec2-user/.pm2/logs/foodme-backend-simple-out.log
    attributes:
      logtype: foodme-application
      service: foodme-backend
      environment: production
      component: nodejs-backend
      log_level: info
      
  - name: foodme-backend-simple-errors
    file: /home/ec2-user/.pm2/logs/foodme-backend-simple-error.log
    attributes:
      logtype: foodme-application
      service: foodme-backend
      environment: production
      component: nodejs-backend
      log_level: error
  # nginx's own logs (spec section 11.0): I5's evidence lives here - the
  # 502s in the access log and the "upstream prematurely closed" lines in
  # the error log. Until now only the integration parsed these files for
  # metrics; the lines themselves were never forwarded.
  - name: nginx-access
    file: /var/log/nginx/access.log
    attributes:
      logtype: nginx-access
      service: nginx
      environment: production
      component: reverse-proxy

  - name: nginx-error
    file: /var/log/nginx/error.log
    attributes:
      logtype: nginx-error
      service: nginx
      environment: production
      component: reverse-proxy
