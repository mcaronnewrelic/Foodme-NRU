integrations:
  - name: nri-postgresql
    env:
      # PostgreSQL connection details for EC2 deployment
      HOSTNAME: localhost
      PORT: 5432
      USERNAME: newrelic
      DATABASE: foodme
      # Use environment variable for password
      PASSWORD: ${NEWRELIC_DB_PASSWORD}
      # SSL configuration
      SSL_MODE: disable
      # Connection timeout
      CONNECTION_TIMEOUT: 5
      # Enable metrics collection
      METRICS: true
      # Enable inventory collection
      INVENTORY: true
      # Collect extended metrics
      COLLECT_DB_LOCK_METRICS: true
      COLLECT_BLOAT_METRICS: true
      # Custom attributes for easier filtering
      CUSTOM_ATTRIBUTES: '{"service":"postgresql","environment":"${ENVIRONMENT}","application":"foodme","database":"foodme","deployment":"ec2"}'
      # Enable custom queries for FoodMe-specific metrics
      CUSTOM_METRICS_QUERY: |
        SELECT 
          'database_size' as metric_name,
          pg_database_size('foodme') as metric_value,
          'bytes' as metric_unit
        UNION ALL
        SELECT 
          'active_connections' as metric_name,
          COUNT(*) as metric_value,
          'connections' as metric_unit
        FROM pg_stat_activity 
        WHERE state = 'active'
        UNION ALL
        SELECT 
          'idle_connections' as metric_name,
          COUNT(*) as metric_value,
          'connections' as metric_unit
        FROM pg_stat_activity 
        WHERE state = 'idle';
    interval: 30s
    labels:
      env: ${ENVIRONMENT}
      role: database
      service: postgresql
      application: foodme
      deployment: ec2
    inventory_source: config/postgresql
