# Log forwarding for the infra agent. REFERENCE COPY: the instance
# receives this content from the logging heredoc in
# cloudformation/install-orderup.sh (written to
# /etc/newrelic-infra/logging.d/logging.yml at install time) - nothing
# ships this file itself. Keep the two in sync; the heredoc is
# authoritative. (Before the orderup rename, no delivery path existed
# at all.)
#
# App entries point at the PM2 ecosystem's configured log files under
# /opt/orderup/logs (not PM2's ~/.pm2 defaults). Spec section 11.0:
# I5's evidence lives in the nginx entries - the 502s in the access
# log (JSON since the rename, so its fields arrive as attributes) and
# the "upstream prematurely closed" lines in the error log.
#
# PostgreSQL arrives as files from the data directory: the instance
# postgresql.conf runs with logging_collector on (verified with SHOW
# on the live instance 2026-11-04), redirecting the install script's
# log_lock_waits / log_min_duration_statement output to
# /var/lib/pgsql/data/log/. An earlier revision of this file tried a
# systemd journal source instead; the journal only ever carries the
# postmaster's pre-collector lines, so nothing arrived. Same lesson
# for PM2: its daemon log is a file under the ec2-user home, not the
# journal.
logs:
  - name: orderup-backend-output
    file: /opt/orderup/logs/orderup-backend-out.log
    attributes:
      logtype: orderup-application
      service: orderup-backend
      environment: production
      component: nodejs-backend
      log_level: info

  - name: orderup-backend-errors
    file: /opt/orderup/logs/orderup-backend-error.log
    attributes:
      logtype: orderup-application
      service: orderup-backend
      environment: production
      component: nodejs-backend
      log_level: error

  - name: nginx-access
    file: /var/log/nginx/access.log
    attributes:
      logtype: nginx-access
      service: nginx
      environment: production
      component: reverse-proxy

  - name: nginx-error
    file: /var/log/nginx/error.log
    attributes:
      logtype: nginx-error
      service: nginx
      environment: production
      component: reverse-proxy

  # PostgreSQL logs to files: logging_collector is on in the
  # instance postgresql.conf (verified via SHOW 2026-11-04), so the
  # server log lives in the data directory's log folder. The journal
  # only carries the postmaster's pre-collector lines, which is why
  # a systemd source sees nothing but start/stop.
  - name: postgresql-log
    file: /var/lib/pgsql/data/log/postgresql-*
    attributes:
      logtype: postgresql
      service: postgresql
      environment: production
      component: database

  # PM2's daemon log is a file under the ec2-user home (restarts,
  # crash loops); the per-app files above don't include it.
  - name: pm2-daemon-log
    file: /home/ec2-user/.pm2/pm2.log
    attributes:
      logtype: pm2-daemon
      service: orderup-backend
      environment: production
      component: process-manager

  - name: cloud-init-output
    file: /var/log/cloud-init-output.log
    attributes:
      logtype: cloud-init
      service: instance-bootstrap
      environment: production
      component: cloud-init
